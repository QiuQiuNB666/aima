<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#101c1a"><title>EYE OS · 画面输出 · Emma0923</title>
  <link rel="icon" href="icon.svg" type="image/svg+xml"><link rel="stylesheet" href="display.css">
  <script type="module" src="display-receiver.js"></script>
</head>
<body>
  <main id="stage" class="stage" data-theme="kyoto">
    <div class="sky" aria-hidden="true"><div class="sun"></div><div class="mountain back"></div><div class="mountain front"></div><div class="trail"></div></div>
    <section class="scene-copy"><span id="region">KYOTO, JAPAN</span><h1 id="scene-title">京都 · 巷间慢行</h1><p id="scene-subtitle">把目光，留给风景。</p><small>风景示意 · 非实时街景</small></section>
    <video id="game-video" muted autoplay playsinline hidden aria-label="共享的游戏画面"></video>
    <div class="receiver-status"><span>EYE OS <b>·</b> Emma0923</span><span id="source-state">本地画面预览</span></div>
  </main>
  <aside class="display-toolbar" aria-label="画面设置">
    <span id="viewport-info">自动适配中</span>
    <button id="fullscreen">全屏</button><button id="stop-sharing" hidden>停止共享</button><button id="close-display">关闭画面</button>
    <span id="display-message" role="status">首次全屏请点击按钮；声音由系统输出。</span>
  </aside>
</body>
</html>
