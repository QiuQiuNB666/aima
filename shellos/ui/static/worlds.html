<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><title>峰哥亡命天涯 · 选择地图</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<style>
/* D 线 9/24：设计系统（变量 / 面板 / 按钮 / kbd）在 /game/ui/design.js，和操作台共用；这里只放选山页自己的布局。
   目标：1080p 一屏放下 8 张卡不滚动；珠峰主打占两格；选中态紫描边 + 轻微放大，方向键移动 120 ms 过渡 */
:root{--bg:#070911;--panel:#0b0d14;--panel2:#10141d;--line:rgba(255,255,255,.09);--line2:rgba(255,255,255,.18);--fg:#e8ecf3;--dim:#98a3b3;--mute:#5c6875;--acc:#b48cff;--acc-dim:rgba(180,140,255,.16);--warn:#ff9f1a;--r:.8rem;--r2:.5rem}
body{margin:0;background:#070911;color:#e8ecf3}
body{background:radial-gradient(ellipse 60% 50% at 20% -10%,rgba(180,140,255,.18) 0,transparent 70%),radial-gradient(ellipse 50% 40% at 100% 0,rgba(41,231,255,.06) 0,transparent 60%),var(--bg) fixed;min-height:100vh;display:flex;flex-direction:column}
header{display:flex;align-items:baseline;gap:1rem;padding:1rem 2rem .2rem}
header h1{margin:0;font-size:2.2rem;font-weight:900;letter-spacing:.14em;line-height:1.1;text-shadow:0 0 1.6rem rgba(180,140,255,.55)}
header p{margin:0;color:var(--dim);font-size:1rem;flex:1;min-width:0}
.back{color:var(--fg);text-decoration:none;font-size:.85rem;font-weight:800;padding:.4rem .9rem;border-radius:var(--r2);background:var(--panel);border:1px solid var(--line2);white-space:nowrap;align-self:center}
/* 造山：主视觉——大输入框、紫描边、发光 */
.mk{display:grid;grid-template-columns:minmax(0,1fr) auto auto;gap:.6rem;align-items:center;padding:.6rem 2rem .2rem}
.mk input{height:3.4rem;padding:0 1.2rem;font:inherit;font-size:1.3rem;font-weight:700;border-radius:var(--r);border:1px solid rgba(180,140,255,.55);background:linear-gradient(90deg,rgba(180,140,255,.10),rgba(180,140,255,.03));color:var(--fg);box-shadow:0 0 0 .25rem rgba(180,140,255,.08),0 .6rem 2rem rgba(0,0,0,.4)}
.mk input::placeholder{color:rgba(232,236,243,.42);font-weight:600}
.mk input:focus{outline:none;border-color:var(--acc);box-shadow:0 0 0 .3rem rgba(180,140,255,.22),0 0 2.5rem rgba(180,140,255,.3)}
.mk button{height:3.4rem;padding:0 1.6rem;font:inherit;font-size:1.3rem;font-weight:900;letter-spacing:.1em;border-radius:var(--r);border:0;background:var(--acc);color:#000;cursor:pointer;white-space:nowrap;box-shadow:0 .4rem 1.6rem rgba(180,140,255,.35)}
.mk button:disabled{opacity:.5;box-shadow:none}
#mkst{color:var(--dim);font-size:.9rem;min-width:8rem;max-width:16rem}
.keys{display:flex;flex-wrap:wrap;gap:.35rem 1rem;align-items:center;padding:.5rem 2rem 0;color:var(--dim);font-size:.85rem}
.keys kbd{display:inline-block;font:inherit;font-size:.8rem;font-weight:800;line-height:1.5;padding:0 .5rem;margin:0 .1rem;border-radius:999px;border:1px solid var(--line2);background:var(--panel2);color:var(--fg)}
.keys kbd.acc{background:var(--acc);border-color:var(--acc);color:#000}
h2{padding:.7rem 2rem 0;margin:0;font-size:.8rem;color:var(--dim);letter-spacing:.24em;font-weight:800}
h2 small{font-weight:600;letter-spacing:0;color:var(--mute);margin-left:.6rem}
/* 名山：4 列，珠峰占 2 格 */
.grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:.9rem;padding:.5rem 2rem 0}
.card{border-radius:var(--r);overflow:hidden;background:var(--panel);border:1px solid var(--line);display:flex;flex-direction:column;cursor:pointer;min-width:0;
  transition:transform .12s ease-out,border-color .12s,box-shadow .12s}
.card:hover{border-color:var(--line2)}
.card.sel{border-color:var(--acc);box-shadow:0 0 0 .15rem var(--acc),0 1rem 2.5rem rgba(180,140,255,.28);transform:scale(1.02);z-index:1}
.card.gen{border-style:dashed}
.sky{height:6.5rem;position:relative;flex:none}
.sky canvas{position:absolute;inset:0;width:100%;height:100%}
.sky::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,transparent 55%,var(--panel) 100%)}
.tag{position:absolute;top:.5rem;z-index:1;font-size:.75rem;font-weight:800;color:#fff;background:rgba(0,0,0,.55);padding:.05rem .5rem;border-radius:.35rem;letter-spacing:.1em;font-variant-numeric:tabular-nums}
.tag.l{left:.6rem}.tag.r{right:.6rem;font-size:.95rem;background:rgba(0,0,0,.45)}
.body{padding:.45rem .9rem .7rem;display:flex;flex-direction:column;gap:.3rem;flex:1;min-width:0}
.name{font-size:1.45rem;font-weight:900;line-height:1.2;letter-spacing:.02em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sub{color:var(--dim);font-size:.85rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.story,.note,.legend{display:none}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:.35rem;margin-top:.1rem}
.stats div{background:var(--panel2);border:1px solid var(--line);border-radius:var(--r2);padding:.3rem .45rem;min-width:0}
.stats b{display:block;font-size:1.3rem;font-weight:900;font-variant-numeric:tabular-nums;line-height:1.1;letter-spacing:-.02em;white-space:nowrap}
.stats span{font-size:.72rem;color:var(--dim);white-space:nowrap}
.diff{font-size:.72rem;font-weight:900;padding:0 .45rem;border-radius:.3rem;margin-left:.5rem;vertical-align:.25rem;color:#000;background:var(--acc);letter-spacing:.06em}
.diff.hard{background:var(--warn)}
.star{font-size:.72rem;font-weight:900;padding:0 .45rem;border-radius:.3rem;margin-left:.3rem;vertical-align:.25rem;color:#000;background:var(--who-fengge,#ffb03a);letter-spacing:.06em}
.mix{display:flex;height:.4rem;border-radius:.2rem;overflow:hidden;margin-top:.1rem}
.rec{font-size:.85rem;color:var(--dim);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:auto;padding-left:1rem;position:relative}.rec b{color:var(--acc);font-variant-numeric:tabular-nums;font-weight:900}
.rec::before{content:"";position:absolute;left:.1rem;top:.45em;width:.5rem;height:.5rem;border-radius:50%;background:var(--mute)}.rec.has::before{background:var(--who-ghost,#9fe8ff);box-shadow:0 0 .4rem var(--who-ghost,#9fe8ff)}
/* 主打卡：占两格，天空更高，海拔大数字，右半放故事 */
.card.feat{grid-column:span 2;border-color:rgba(255,176,58,.35)}
.card.feat.sel{border-color:var(--acc)}
.card.feat .sky{height:6.5rem}
.card.feat .tag.r{top:auto;bottom:.4rem;right:.9rem;background:transparent;font-size:2.5rem;font-weight:900;letter-spacing:-.02em;text-shadow:0 .1rem .8rem rgba(0,0,0,.8);padding:0;z-index:1}
.card.feat .body{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);grid-template-areas:"name story" "sub story" "stats story" "mix story" "rec story";gap:.3rem 1.2rem}
.card.feat .name{grid-area:name;font-size:1.7rem}.card.feat .sub{grid-area:sub}.card.feat .stats{grid-area:stats}.card.feat .mix{grid-area:mix}.card.feat .rec{grid-area:rec}
.card.feat .story{grid-area:story;display:block;font-size:.95rem;line-height:1.5;color:var(--fg);padding-left:1.2rem;border-left:1px solid var(--line);align-self:start}
.card.feat .legend{display:flex;grid-area:story;align-self:end;gap:.6rem;flex-wrap:wrap;font-size:.75rem;color:var(--dim);padding-left:1.2rem}
.card.feat .legend i{display:inline-block;width:.55rem;height:.55rem;border-radius:.15rem;margin-right:.25rem}
/* 训练场 + 跑酷：一行横条卡 */
.strip{display:grid;grid-template-columns:auto minmax(0,1fr) auto minmax(0,1fr);gap:.9rem;align-items:stretch;padding:.5rem 2rem 1rem}
.strip h2{padding:0;writing-mode:vertical-rl;text-orientation:upright;letter-spacing:.3em;align-self:center;color:var(--mute)}
.strip .grid{display:flex;padding:0;gap:.9rem}
.strip .card{flex:1;flex-direction:row;min-height:5.6rem}
.strip .sky{width:9rem;height:auto;flex:none}
.strip .sky::after{background:linear-gradient(90deg,transparent 40%,var(--panel) 100%)}
.strip .tag.r{display:none}
.strip .body{padding:.5rem .9rem;gap:.2rem;justify-content:center}
.strip .name{font-size:1.2rem}
.strip .stats{grid-template-columns:repeat(4,auto);justify-content:start;gap:.3rem .6rem}
.strip .stats div{padding:.15rem .5rem;display:flex;align-items:baseline;gap:.3rem}
.strip .stats b{font-size:1rem;display:inline}
.strip .rec,.strip .mix{display:none}
.strip .card.pk{background:linear-gradient(90deg,rgba(255,46,136,.12),var(--panel) 60%);border-color:rgba(255,46,136,.35)}
.strip .card.pk .note{display:block;font-size:.8rem;color:var(--dim)}
.strip .card.pk .note kbd{font:inherit;font-weight:800;padding:0 .4rem;border-radius:999px;border:1px solid var(--line2);background:var(--panel2);color:var(--fg)}
.go{position:fixed;right:2rem;bottom:1.4rem;padding:.9rem 1.6rem;font:inherit;font-size:1.3rem;font-weight:900;border-radius:var(--r);border:0;background:var(--acc);color:#000;cursor:pointer;display:none;box-shadow:0 .5rem 2rem rgba(0,0,0,.55),0 0 0 .25rem rgba(180,140,255,.25);z-index:2}
@media (max-width:1500px){.sky{height:5.5rem}.card.feat .tag.r{font-size:2rem}}
@media (max-width:1200px){html{font-size:12px}header,.mk,.keys,h2,.grid,.strip{padding-left:1rem;padding-right:1rem}}
@media (max-width:1100px){.grid{grid-template-columns:repeat(2,minmax(0,1fr))}.strip{grid-template-columns:auto minmax(0,1fr)}.strip .grid{flex-direction:column}}
@media (max-width:700px){html{font-size:13px}.grid{grid-template-columns:1fr}.card.feat{grid-column:auto}.card.feat .body{display:flex}.card.feat .story{display:none}header{flex-wrap:wrap}.mk{grid-template-columns:1fr auto}#mkst{grid-column:1/-1}}
</style></head><body>
<header><h1>选择地图</h1><p>你在原地迈步，坡和台阶会变成腿上的力；上一位登山者化作影子，和你并排爬。</p><a class="back" href="/game">← 回游戏（Esc）</a></header>
<div class="mk"><input id="mk" placeholder="说一句话，现场造一座山：峰哥被追到泰山顶，一路狂奔上十八盘……"><button id="mkb">造山</button><span id="mkst"></span></div>
<div class="keys"><span><kbd>←</kbd><kbd>→</kbd><kbd>↑</kbd><kbd>↓</kbd> 选山</span><span><kbd class="acc">Enter</kbd> 进入</span><span><kbd>/</kbd> 跳到造山框</span><span><kbd>Esc</kbd> 回游戏</span><span><kbd>P</kbd> 跑酷闯关</span></div>
<h2>名山<small>珠峰是展位主打；卡片上的步数 / 台阶 / 红灯按路线现算，和游戏里一样</small></h2>
<div class="grid" id="main"></div>
<div class="strip">
<h2>训练场</h2>
<div class="grid" id="train"></div>
<h2>跑酷</h2>
<div class="grid"><a class="card pk" href="/parkour" style="text-decoration:none;color:inherit"><div class="body"><div class="name">屋顶跑酷<span class="diff hard">闯关</span></div><div class="sub">峰哥在屋顶上被捷风追，起跳前外骨骼帮你抬腿</div><div class="note">全靠腿：快抬一条腿 = 跳 · 下蹲 = 滑铲 · 抬一条腿保持 0.3 s = 往那边换道 / 转弯 · 按 <kbd>P</kbd> 直接进入</div></div></a></div>
</div>
<button class="go" id="go">进入 →</button>
<script type="module">
import { inject, SEG } from '/game/ui/design.js';
inject();
const KN={flat:'平地',up:'上坡',down:'下坡',stairs_up:'上台阶',stairs_down:'下台阶',wait:'站定'};
const RISE={flat:0,up:.08,down:-.08,stairs_up:.12,stairs_down:-.12,wait:0};
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const fmt=s=>s==null?'—':s<60?`${s.toFixed(1)} s`:`${Math.floor(s/60)}:${(s%60).toFixed(1).padStart(4,'0')}`;
// 最佳成绩：游戏页每次登顶记进 localStorage（fg_records，同一台大屏）；当前世界再用 /state 的 best / ghost_who 补上（ShellOS 内存里的，只读）
let REC={};try{REC=JSON.parse(localStorage.getItem('fg_records')||'{}')||{}}catch(e){}
let cards=[],chosen=null;
const FEATURED='everest_north';   // 9/23 定：展位主打地图（docs/珠峰-架构.md），排第一张、大一号、带「主打」
function drawSky(cv,w){
  const r=cv.getBoundingClientRect(),W=cv.width=r.width*devicePixelRatio,H=cv.height=r.height*devicePixelRatio,ctx=cv.getContext('2d');
  if(!W||!H)return;
  const t=w.theme,g=ctx.createLinearGradient(0,0,0,H);g.addColorStop(0,t.sky[0]);g.addColorStop(1,t.sky[1]);ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
  ctx.fillStyle=t.fog;ctx.globalAlpha=.55;ctx.beginPath();ctx.moveTo(0,H);
  if(t.style==='cyber_night'){for(let x=0;x<W;x+=W/22){const bh=H*(.25+.45*Math.abs(Math.sin(x*.013+1)));ctx.lineTo(x,H-bh);ctx.lineTo(x+W/26,H-bh)}}
  else{for(let x=0;x<=W;x+=4)ctx.lineTo(x,H*.55-Math.sin(x/W*6+1)*H*.08-Math.sin(x/W*17)*H*.03)}
  ctx.lineTo(W,H);ctx.fill();ctx.globalAlpha=1;
  let h=0;const pts=[];w.route.forEach(s=>{for(let k=0;k<s.steps;k++){pts.push([h,s.kind]);h+=RISE[s.kind]}});
  const hs=pts.map(p=>p[0]),mn=Math.min(...hs),mx=Math.max(...hs,mn+.01);
  const X=i=>W*.06+i/(pts.length-1)*W*.88,Y=v=>H*.92-(v-mn)/(mx-mn)*H*.62;
  ctx.lineWidth=(w.id===FEATURED?5:4)*devicePixelRatio;ctx.lineCap='round';
  for(let i=0;i<pts.length-1;i++){ctx.strokeStyle=SEG[pts[i][1]]||SEG.flat;ctx.beginPath();
    if(pts[i][1].startsWith('stairs')){ctx.moveTo(X(i),Y(pts[i][0]));ctx.lineTo(X(i+1),Y(pts[i][0]));ctx.lineTo(X(i+1),Y(pts[i+1][0]))}
    else{ctx.moveTo(X(i),Y(pts[i][0]));ctx.lineTo(X(i+1),Y(pts[i+1][0]))}ctx.stroke()}
  const e=pts.length-1;ctx.fillStyle='#fff';ctx.beginPath();ctx.moveTo(X(e),Y(pts[e][0]));ctx.lineTo(X(e),Y(pts[e][0])-22*devicePixelRatio);ctx.lineTo(X(e)+14*devicePixelRatio,Y(pts[e][0])-16*devicePixelRatio);ctx.lineTo(X(e),Y(pts[e][0])-10*devicePixelRatio);ctx.fill();
}
// 难度：台阶占比 + 红灯 / 站定数 + 步数（按 route 现算，和游戏里的路段一样）
function stat(w){
  const n=w.route.reduce((a,s)=>a+s.steps,0)||1,st=w.route.filter(s=>s.kind.startsWith('stairs')).reduce((a,s)=>a+s.steps,0);
  const waits=w.route.filter(s=>s.kind==='wait'),red=waits.some(s=>/红灯/.test(s.label));
  const sh=st/n,hard=sh>=.35||n>=50,easy=sh<.15&&n<40&&!waits.length;
  return {n,stairs:Math.round(sh*100),waits:waits.length,waitName:red?'红灯':'站定',diff:hard?'硬核':easy?'入门':'适中',hard};
}
function card(w,i){
  const d=document.createElement('div');d.className='card'+(w.generated?' gen':'')+(w.id===FEATURED?' feat':'');d.tabIndex=-1;
  const S=stat(w),rec=REC[w.id]||{};
  const mix=Object.entries(w.mix).map(([k,v])=>`<div style="flex:${v};background:${SEG[k]||SEG.flat}"></div>`).join('');
  const leg=Object.entries(w.mix).map(([k,v])=>`<span><i style="background:${SEG[k]||SEG.flat}"></i>${k==='wait'?S.waitName:KN[k]||k} ${v}</span>`).join('');
  d.innerHTML=`<div class="sky"><canvas></canvas><div class="tag l">${w.training?'训练场':w.generated?(w.generated==='claude'?'AI 造':'现场造'):'0'+(i+1)}</div><div class="tag r">${esc(w.alt[0])} → ${esc(w.alt[1])} ${esc(w.unit)}</div></div>
   <div class="body"><div class="name">${esc(w.name)}<span class="diff${S.hard?' hard':''}">${S.diff}</span>${w.id===FEATURED?'<span class="star">主打</span>':''}</div><div class="sub">${esc(w.subtitle)}</div>
   <div class="stats"><div><b>${S.n}</b><span>步</span></div><div><b>${S.stairs}%</b><span>台阶</span></div><div><b>${S.waits}</b><span>${S.waitName}</span></div><div><b>${esc(Math.round(w.alt[1]-w.alt[0]))}</b><span>爬升 ${esc(w.unit)}</span></div></div>
   <div class="mix">${mix}</div><div class="legend">${leg}</div>
   <div class="rec${rec.best!=null?' has':''}" data-rec>${rec.best!=null?`最佳 <b>${fmt(rec.best)}</b>${rec.who?` · 影子：${esc(rec.who)}`:''}`:'还没人登顶过——第一个爬上去的人会变成影子'}</div>
   ${w.story?`<div class="story">${esc(w.story)}</div>`:''}
   ${w.note?`<div class="note">${esc(w.note)}</div>`:''}</div>`;
  d.onclick=()=>pick(d,w);d.ondblclick=()=>{pick(d,w);go()};
  requestAnimationFrame(()=>drawSky(d.querySelector('canvas'),w));return d;
}
const $go=document.getElementById('go');
function pick(d,w){cards.forEach(c=>c.el.classList.remove('sel'));d.classList.add('sel');chosen=w.id;$go.style.display='block';$go.textContent='进入「'+w.name+'」 →（Enter）';d.scrollIntoView({block:'nearest',behavior:'smooth'})}
async function go(){if(!chosen)return;try{await fetch('/ctl',{method:'POST',body:JSON.stringify({name:'terrain'})});await fetch('/terrain',{method:'POST',body:JSON.stringify({preset:chosen})})}catch(e){}location.href='/game'}
$go.onclick=go;
async function load(pick_){
  let ws;try{ws=await fetch('/worlds.json').then(r=>r.json())}catch(e){document.getElementById('main').innerHTML='<div class="empty bad" style="grid-column:1/-1"><b>没连上 ShellOS</b><span>先在 MacBook 上起 shellos.main（--sim 也行），再刷新这页</span></div>';return}
  let cur=null;try{cur=(await (await fetch('/state')).json()).terrain}catch(e){}
  ws.forEach(w=>{if(w.best!=null)REC[w.id]={best:w.best,who:w.ghost_who}});   // ShellOS 内存为准；没有的（重启过）才用浏览器里的 fg_records
  if(cur&&cur.best!=null)REC[cur.preset]={...(REC[cur.preset]||{}),best:Math.min(cur.best,(REC[cur.preset]||{}).best??1e9),who:(REC[cur.preset]||{}).who||cur.ghost_who};
  let n=0;cards=[];
  document.getElementById('main').innerHTML='';document.getElementById('train').innerHTML='';
  ws.sort((a,b)=>(b.id===FEATURED)-(a.id===FEATURED));
  ws.forEach(w=>{const c=card(w,w.training?0:n++);cards.push({el:c,w});(w.training?document.getElementById('train'):document.getElementById('main')).appendChild(c)});
  const want=pick_||(cur&&cur.preset),hit=cards.find(c=>c.w.id===want)||cards[0];if(hit)pick(hit.el,hit.w);
}
load();
addEventListener('resize',()=>cards.forEach(c=>drawSky(c.el.querySelector('canvas'),c.w)));
// 键盘：方向键按屏幕位置在卡片之间走（两个网格一起算），Enter 进入，/ 跳到造山框，Esc 回游戏。造山框里打字时不抢键
addEventListener('keydown',e=>{
  if(document.activeElement===$mk){if(e.key==='Escape')$mk.blur();return}
  if(e.key==='Escape'){location.href='/game';return}
  if(e.key==='p'||e.key==='P'){location.href='/parkour';return}
  if(e.key==='/'){e.preventDefault();$mk.focus();return}
  if(e.key==='Enter'){e.preventDefault();go();return}
  const dir={ArrowLeft:[-1,0],ArrowRight:[1,0],ArrowUp:[0,-1],ArrowDown:[0,1]}[e.key];if(!dir||!cards.length)return;e.preventDefault();
  const cur=cards.find(c=>c.w.id===chosen)||cards[0],a=cur.el.getBoundingClientRect(),ax=a.left+a.width/2,ay=a.top+a.height/2;
  let best=null,bd=1e9;
  for(const c of cards){if(c===cur)continue;const b=c.el.getBoundingClientRect(),dx=b.left+b.width/2-ax,dy=b.top+b.height/2-ay;
    if(dir[0]&&Math.sign(dx)!==dir[0]||dir[0]&&Math.abs(dy)>a.height*.6)continue;if(dir[1]&&(Math.sign(dy)!==dir[1]||Math.abs(dy)<a.height*.3))continue;
    const dd=Math.abs(dx)+Math.abs(dy)*1.5;if(dd<bd){bd=dd;best=c}}
  if(best)pick(best.el,best.w);
});
const $mk=document.getElementById('mk'),$mkb=document.getElementById('mkb'),$mkst=document.getElementById('mkst');
$mkb.onclick=async()=>{const t=$mk.value.trim();if(!t)return;$mkb.disabled=true;$mkst.textContent='大模型在画路线，十秒上下…';
  try{const r=await (await fetch('/world/generate',{method:'POST',body:JSON.stringify({text:t})})).json();
    if(r.world){$mkst.textContent=r.world.generated==='claude'?'大模型造好了，安全员审过了':'大脑离线，用规则模板造的';await load(r.world.id)}else $mkst.textContent=r.error||'没造出来'}
  catch(e){$mkst.textContent='没连上 ShellOS'}$mkb.disabled=false};
$mk.addEventListener('keydown',e=>{if(e.key==='Enter')$mkb.click()});
</script></body></html>
