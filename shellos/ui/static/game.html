<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><title>峰哥亡命天涯</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<script>
// 错误收集：运行时错误、未处理的 Promise、脚本/资源加载失败都写进隐藏的 pre#errlog，scripts/dom.sh 用 --dump-dom 读
(function () {
  var L = [];
  function flush() { var e = document.getElementById('errlog'); if (e) e.textContent = L.join('\n'); }
  window.__err = function (m) { if (L.length < 60) L.push(String(m)); flush(); };
  addEventListener('error', function (e) {
    var t = e.target;
    if (t && t !== window && t.tagName) return __err('加载失败：' + (t.src || t.href || '<' + t.tagName.toLowerCase() + '> 里 import 的模块（文件不存在或语法错）'));
    __err(e.error && e.error.stack ? e.error.stack : (e.message || '?') + ' @' + (e.filename || '') + ':' + (e.lineno || ''));
  }, true);
  addEventListener('unhandledrejection', function (e) { var r = e.reason; __err('unhandledrejection: ' + (r && r.stack ? r.stack : r)); });
  document.addEventListener('DOMContentLoaded', flush);
})();
</script>
<script>try{var f=JSON.parse(sessionStorage.getItem('u_forge')||'null');if(f&&Date.now()-f.t<150e3)document.documentElement.classList.add('u-forging')}catch(e){}</script>
<script src="/game/settings.js"></script>   <!-- U 线：设置（localStorage + 地址栏覆盖），必须在所有模块之前 -->
<script type="importmap">{"imports":{"three":"/vendor/three.module.js","three/addons/":"/vendor/"}}</script>
<style>
:root{--fg:#f4f7fa;--dim:#a9b3bf;--panel:rgba(8,10,16,.86);--line:rgba(255,255,255,.12);--acc:#29e7ff;--acc0:#ff2e88}
html{font-size:clamp(13px,1.04vw,44px)}
*{box-sizing:border-box}
body{margin:0;overflow:hidden;background:#05060a;color:var(--fg);font-family:-apple-system,"PingFang SC","Hiragino Sans GB","Noto Sans CJK SC",sans-serif;user-select:none}
#c{position:fixed;inset:0;display:block;width:100vw;height:100vh}
.hud{position:fixed;pointer-events:none;text-shadow:0 1px 3px rgba(0,0,0,.6)}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:1rem;padding:.8rem 1.1rem}   /* 不用 backdrop-filter：盖在 WebGL 上每帧重新模糊（ART 美术范式 §7） */
#tl{left:1.4rem;top:1.2rem;display:flex;flex-direction:column;gap:.5rem;max-width:30rem}
#back{pointer-events:auto;align-self:flex-start;color:var(--fg);text-decoration:none;font-size:1rem;padding:.45rem .9rem;border-radius:.7rem;background:var(--panel);border:1px solid var(--line)}
#back:hover{border-color:#fff}
#wname{font-size:1.7rem;font-weight:800;letter-spacing:.1em}
#wsub{font-size:.9rem;color:var(--dim)}
#tc{left:50%;top:1.2rem;transform:translateX(-50%);text-align:center;min-width:19rem;max-width:34rem}
#seg{font-size:2.5rem;font-weight:800;letter-spacing:.08em;line-height:1.15}
.chip{display:inline-block;font-size:.95rem;font-weight:700;padding:.12rem .6rem;border-radius:.45rem;color:#000;vertical-align:.35rem;margin-left:.5rem}
#next{margin-top:.35rem;font-size:1.25rem;color:#fff}
#next b{color:var(--acc);font-size:2.5rem;vertical-align:-.2rem}
#tr{right:1.4rem;top:3.2rem;text-align:right;min-width:15rem}
#alt{font-size:3.4rem;font-weight:800;line-height:1;font-variant-numeric:tabular-nums}
#alt small{font-size:1.3rem;color:var(--dim);margin-left:.2rem}
#step{font-size:2.5rem;font-weight:800;margin-top:.3rem;font-variant-numeric:tabular-nums}
#prog{height:.45rem;border-radius:.3rem;background:rgba(255,255,255,.15);margin-top:.5rem;overflow:hidden}
#prog i{display:block;height:100%;width:0;background:var(--acc);transition:width .25s}
.bar{position:relative;height:1.05rem;border-radius:.5rem;background:rgba(255,255,255,.12);overflow:hidden}
.bar::after{content:"";position:absolute;left:50%;top:0;bottom:0;width:2px;background:rgba(255,255,255,.35)}
.bar i{position:absolute;top:0;bottom:0;left:50%;width:0;background:var(--acc);border-radius:.3rem}
#hint{left:50%;bottom:1.4rem;transform:translateX(-50%);font-size:1rem;color:var(--dim);display:none}
#hint kbd{display:inline-block;padding:.05rem .45rem;margin:0 .15rem;border-radius:.35rem;border:1px solid rgba(255,255,255,.35);color:#fff;font:inherit}
#hint .on{color:#3ddc84}
#wait{left:50%;top:25%;transform:translate(-50%,-50%);text-align:center;display:none;border-color:rgba(255,77,79,.6)}   /* = --seg-wait 60% */
#wait .big{font-size:2.5rem;font-weight:800;color:var(--seg-wait)}
#wait .sub{font-size:2.5rem;font-weight:800;font-variant-numeric:tabular-nums;margin-top:.2rem}
#wait .bar{margin-top:.6rem;height:.7rem}
#wait .bar::after{display:none}
#wait .bar i{left:0;background:var(--seg-up)}
#summit{left:50%;bottom:5%;transform:translate(-50%,0) scale(.9);text-align:center;opacity:0;transition:opacity .5s,transform .5s;padding:.8rem 2rem;max-width:56rem}
#summit.show{opacity:1;transform:translate(-50%,0) scale(1);transition-delay:.8s}
body.preview #summit,body.preview #summit.show{transition:none}
body.sc-left #summit{left:1.4rem;bottom:1.4rem;text-align:left;max-width:44vw;transform:scale(.9);transform-origin:left bottom}
body.sc-left #summit.show{transform:none}
body.summit #hint{display:none!important}
#summit .t2{font-size:2.4rem;font-weight:900;letter-spacing:.12em;line-height:1.15}
#summit .t2::before{content:"登顶 · ";font-size:1.3rem;font-weight:700;letter-spacing:.2em;color:var(--dim);vertical-align:.35rem}
#summit .t3{font-size:1.15rem;margin-top:.2rem}
#summit .t4{font-size:1.25rem;margin-top:.3rem;font-variant-numeric:tabular-nums}
#summit .t5{font-size:1rem;margin-top:.3rem;color:var(--acc)}
#ghostTag{transform:translate(-50%,-100%);font-size:.9rem;font-weight:700;white-space:nowrap;padding:.3rem .8rem;border-radius:.6rem;background:rgba(4,8,14,.86);border:2px solid rgba(159,232,255,.8);color:#dff6ff;display:none;box-shadow:0 2px 10px rgba(0,0,0,.5)}
#ghostTag small{color:var(--dim);margin-left:.4rem}
#banner{left:50%;top:50%;transform:translate(-50%,-50%);text-align:center;font-size:1.3rem;display:none;pointer-events:auto}
#banner button{margin-top:.8rem;font:inherit;font-weight:700;padding:.5rem 1.2rem;border-radius:.7rem;border:0;cursor:pointer}
#fps{left:.5rem;bottom:.3rem;font-size:.75rem;color:rgba(255,255,255,.45);font-variant-numeric:tabular-nums;display:none}
body.debug #fps{display:block}   /* 帧率 / loop 调试行：大屏默认藏，?debug=1 才显示 */
#puppet{left:50%;top:1.2rem;transform:translateX(-50%);text-align:center;display:none;border-color:rgba(41,231,255,.5)}
#puppet .t{font-size:2.6rem;font-weight:900;letter-spacing:.12em}
#puppet .s{font-size:1.2rem;color:var(--dim);margin-top:.3rem}
body.puppet #tc,body.puppet #tr,body.puppet #wait,body.puppet #summit,body.puppet #ghostTag{display:none!important}
body.puppet #puppet{display:block}
/* U 线：右上角安全灯（任何状态都在最上层） */
#lamp{right:.6rem;top:.5rem;z-index:70;display:flex;align-items:center;gap:.5rem;padding:.25rem .8rem .25rem .4rem;border-radius:2rem;background:rgba(0,0,0,.72);font-size:1.05rem;font-weight:800}
#lamp i{width:1.5rem;height:1.5rem;border-radius:50%;background:#7b8591;box-shadow:0 0 .8rem currentColor;color:#7b8591}
#lamp small{font-size:.8rem;font-weight:600;color:var(--dim)}
#lamp.green i{background:#3ddc84;color:#3ddc84}#lamp.green{color:#8ff0b4}
#lamp.red i{background:#ff4d4f;color:#ff4d4f;animation:lampBlink .6s steps(2) infinite}#lamp.red{color:#ff8a8b}
@keyframes lampBlink{50%{opacity:.35}}
/* U 线：造山过场（hud_ai.js 填内容；下面的小脚本在模块加载前就挂上，引擎重载时不闪出旧画面） */
#forge{inset:0;z-index:50;display:none;align-items:center;justify-content:center;background:radial-gradient(ellipse at 50% 60%,rgb(16,21,33),rgb(3,4,8));transition:opacity .8s}
html.u-forging #forge{display:flex}
#errlog{display:none}
#cut{inset:0;background:#000;opacity:0}
#tag{left:50%;top:50%;transform:translate(-50%,-50%);font-size:1.2rem;color:var(--dim)}
</style></head><body>
<canvas id="c"></canvas>
<div class="hud" id="cut"></div>
<div class="hud" id="tl"><a id="back" href="/worlds">← 换一座山</a><div class="panel"><div id="wname">…</div><div id="wsub"></div></div></div>
<div class="hud panel" id="tc"><div id="seg">…</div><div id="next"></div></div>
<div class="hud panel" id="tr"><div id="alt">—<small></small></div><div id="step"></div><div id="prog"><i></i></div></div>
<div class="hud panel" id="hint">模拟：按住 <kbd>空格</kbd> 走 · <kbd>1</kbd><kbd>2</kbd><kbd>3</kbd> 慢/中/快 · <kbd>R</kbd> 回山脚 <span id="hintS"></span></div>
<div class="hud panel" id="wait"><div class="big">● 红灯</div><div class="sub" id="waitT">站定 2 秒放行</div><div class="bar"><i id="waitB"></i></div></div>
<div class="hud panel" id="summit"></div>
<div class="hud panel" id="puppet"><div class="t">共驾：Ghost 操控 Shell</div><div class="s">手柄摇杆直接推两条腿 · 按住 R2 才有力</div></div>
<div class="hud" id="ghostTag"></div>
<div class="hud panel" id="banner"></div>
<div class="hud" id="fps"></div>
<div class="hud" id="lamp"><i></i><span id="lampT">—</span><small id="lampS"></small></div>
<div class="hud" id="forge"><div class="fx"><div class="ft">AI 正在造山…</div></div></div>
<div class="hud" id="tag">加载中…</div>
<pre id="errlog" hidden></pre>
<script type="module" src="/game/engine.js"></script>
<script src="/voice/voice.js"></script>
</body></html>
