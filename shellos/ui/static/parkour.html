<html lang="zh-CN"><head><meta charset="utf-8"><title>峰哥亡命天涯 · 屋顶跑酷</title>
<meta name="viewport" content="width=device-width,initial-scale=1">

<style>
/* 颜色全从 game/style.js 来（main.js 开头 applyCssVars()，覆盖这里的缺省值）：--ui-* / --acc = HUD，--seg-* = 路段，--who-jett = 捷风；--acc0 = 跑酷色板品红 */
:root{--fg:var(--ui-fg,#f4f7fa);--dim:var(--ui-dim,#a9b3bf);--panel:var(--ui-panel,rgba(8,10,16,.86));--line:var(--ui-line,rgba(255,255,255,.12));--acc:#b48cff;--acc0:#ff2e88;--jf:var(--who-jett,#2f7fe0);--bad:var(--ui-danger,#ff4d4f)}
html{font-size:clamp(13px,1.04vw,44px)}
*{box-sizing:border-box}
body{margin:0;overflow:hidden;background:#05060a;color:var(--fg);font-family:-apple-system,"PingFang SC","Hiragino Sans GB","Noto Sans CJK SC",sans-serif;user-select:none}
#c{position:fixed;inset:0;display:block;width:100vw;height:100vh}
.hud{position:fixed;pointer-events:none;text-shadow:0 1px 3px rgba(0,0,0,.6)}
/* 不用 backdrop-filter：盖在 WebGL 画布上每帧都要重新模糊，这台 AMD 555 上 34 → 60 fps 就差它 */
.panel{background:var(--panel);border:1px solid var(--line);border-radius:1rem;padding:.7rem 1.1rem}
#flash{inset:0;background:radial-gradient(ellipse at center,transparent 35%,var(--bad) 100%);opacity:0}
#tl{left:1.4rem;top:1.2rem;display:flex;flex-direction:column;gap:.5rem}
#back{pointer-events:auto;align-self:flex-start;color:var(--fg);text-decoration:none;font-size:1rem;padding:.4rem .9rem;border-radius:.7rem;background:var(--panel);border:1px solid var(--line)}
#name{font-size:1.5rem;font-weight:900;letter-spacing:.12em}
#name small{display:block;font-size:.85rem;font-weight:600;color:var(--dim);letter-spacing:.05em}
#lives{display:flex;gap:.45rem;margin-top:.5rem}
#lives i{width:1.5rem;height:1.5rem;border-radius:50%;border:2px solid var(--acc0);opacity:.35}
#lives i.on{background:var(--acc0);opacity:1;box-shadow:0 0 .7rem var(--acc0)}
#tc{left:50%;top:1rem;transform:translateX(-50%);text-align:center}
#dist{font-size:4.2rem;font-weight:900;line-height:1;font-variant-numeric:tabular-nums}
#tc small{font-size:1.3rem;color:var(--dim);margin-left:.2rem}
#tr{right:1.4rem;top:1.2rem;text-align:right;min-width:16rem}
#tr .big{font-size:2.4rem;font-weight:800;font-variant-numeric:tabular-nums;line-height:1.1}
#tr .big small{font-size:1rem;color:var(--dim);margin-left:.3rem}
#jf{margin-top:.6rem;font-size:1rem;text-align:left}
#jf b{color:var(--jf)}
#jfTrack{height:.55rem;border-radius:.3rem;background:rgba(255,255,255,.14);overflow:hidden;margin-top:.3rem}
#jfBar{height:100%;width:0;background:linear-gradient(90deg,var(--jf),var(--bad));transition:width .2s}
body.danger #tr{border-color:var(--bad);box-shadow:0 0 1.2rem var(--bad)}
#jfSay{right:1.4rem;top:12.5rem;font-size:1.3rem;font-weight:800;color:var(--fg);border-color:var(--jf);opacity:0;transform:translateY(-.4rem);transition:opacity .25s,transform .25s}
#jfSay::before{content:"捷风";display:block;font-size:.75rem;letter-spacing:.2em;color:var(--jf)}
body.talk #jfSay{opacity:1;transform:none}
#hint{left:50%;top:38%;transform:translate(-50%,-50%);font-size:2.6rem;font-weight:900;letter-spacing:.1em;text-shadow:0 0 1rem rgba(0,0,0,.8)}
#hint.jump{color:var(--seg-stairs-up)}#hint.slide{color:var(--acc0)}#hint.lane{color:var(--acc)}   /* 跳 = 台阶黄（起跳前给 lift，和台阶同类） */
#bl{left:1.4rem;bottom:1.4rem;width:24rem;display:flex;flex-direction:column;gap:.45rem;font-size:1rem}
.leg{display:grid;grid-template-columns:2.8rem 1fr;align-items:center;gap:.5rem}
.bar{position:relative;height:.9rem;border-radius:.45rem;background:rgba(255,255,255,.12);overflow:hidden}
.bar::after{content:"";position:absolute;left:50%;top:0;bottom:0;width:2px;background:rgba(255,255,255,.35)}
.bar i{position:absolute;top:0;bottom:0;left:50%;width:0;background:var(--acc)}
#force{color:#fff;font-weight:700}
#r2{color:var(--ui-warn);font-weight:700}#r2.ok{color:var(--ui-ok)}
#legs{color:var(--dim)}
#keys{right:1.4rem;bottom:1.4rem;font-size:.95rem;color:var(--dim);text-align:right;line-height:1.7}
#keys kbd{display:inline-block;padding:0 .4rem;margin:0 .1rem;border-radius:.3rem;border:1px solid rgba(255,255,255,.35);color:#fff;font:inherit}
#title,#over{left:50%;top:50%;transform:translate(-50%,-50%);text-align:center;display:none;padding:1.6rem 2.6rem;min-width:30rem}
body.title #title,body.over #over{display:block}
body.title #hint,body.over #hint{display:none}
#title .t,#over .t{font-size:3rem;font-weight:900;letter-spacing:.14em}
#title .s{font-size:1.4rem;margin-top:.6rem}
#title .s b{color:var(--acc)}
#title .d{font-size:1.05rem;color:var(--dim);margin-top:.8rem;line-height:1.8}
#over{border-color:var(--bad)}
#over .n{font-size:5rem;font-weight:900;line-height:1.1;font-variant-numeric:tabular-nums}
#over .n small{font-size:1.6rem;color:var(--dim)}
#over .w{font-size:1.3rem;color:var(--bad);margin:.2rem 0 .6rem}
#goNew{color:var(--acc);font-size:1.3rem;font-weight:800;display:none}
#over .d{font-size:1.1rem;color:var(--dim);margin-top:.6rem}
#banner{left:50%;top:50%;transform:translate(-50%,-50%);font-size:1.3rem;display:none}
#fps{left:.5rem;bottom:.3rem;font-size:.75rem;color:rgba(255,255,255,.45)}
#errlog{display:none}
body.clean .hud{display:none!important}
</style></head><body class="title">

<div class="hud panel" id="tc"><span id="dist">0</span><small>m</small></div>

  <div class="big"><span id="spd">0</span><small>km/h</small></div>

</div>

  <div class="leg"><span>右腿</span><div class="bar"><i id="barR"></i></div></div>

  <div id="r2">—</div>
  <div id="legs">—</div>
</div>
<div class="hud panel" id="keys">步频越快跑越快<br>高抬腿 <kbd>↑</kbd> 跳 · 下蹲 <kbd>↓</kbd> 滑铲 · <kbd>←</kbd><kbd>→</kbd> 换道<span id="simHint" style="display:none"><br>模拟：按住 <kbd>空格</kbd> 走 · <kbd>1</kbd>–<kbd>4</kbd> 步频</span></div>
<div class="hud panel" id="title"><div class="t">屋顶跑酷</div><div class="s">迈开腿就开跑 —— <b>别让捷风追上</b></div>
  <div class="d">步频 = 速度 · 高抬腿跳过空调和楼缝 · 下蹲钻晾衣杆 · ← → 绕开水箱<br>撞 3 次结束</div></div>
<div class="hud panel" id="over"><div class="t" id="goT">峰哥倒下了</div><div class="w" id="hitWhy"></div><div class="n"><span id="goDist">0</span><small> m</small></div>
  <div id="goNew">★ 新纪录</div><div class="d">最好成绩 <b id="goBest">0</b> m · <b>高抬腿</b> 或 <b>回车</b> 再来一局</div></div>
<div class="hud panel" id="banner"></div>
<div class="hud" id="fps"></div>
<pre id="errlog" hidden></pre>
<script type="module" src="/parkour/main.js"></script>
</body></html>
