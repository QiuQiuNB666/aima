<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><title>峰哥亡命天涯 · A4 海报 v5</title>
<style>
@page{size:A4;margin:0}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:#e8e5e1}
/* 210×297 全出血：画稿按宽铺满，纸纹平铺兜底；印刷裁 3 mm 时所有文字/二维码都在 ≥8 mm 安全区内 */
.page{width:210mm;height:297mm;position:relative;overflow:hidden;color:#1e3a8a;
  background:#e8e5e1 url(paper_v4.jpg) 0 0/210mm auto repeat-y;
  font-family:"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;-webkit-print-color-adjust:exact;print-color-adjust:exact}
.hero{position:absolute;left:0;top:0;width:210mm;height:260.4mm;background:url(hero_v4_cut.jpg) 0 0/100% auto no-repeat;
  -webkit-mask-image:linear-gradient(#000 92%,transparent);mask-image:linear-gradient(#000 92%,transparent)}
.foot{position:absolute;left:10mm;right:10mm;bottom:8.5mm;height:27mm;display:flex;align-items:flex-end;gap:5mm}
.pitch{flex:1.2;padding-bottom:1mm}
.pitch em{display:block;font-style:normal;font-size:8.6pt;font-weight:800;letter-spacing:.12em;color:#2b3a5c;margin-bottom:1mm}
.pitch b{display:block;font-size:14.5pt;font-weight:900;letter-spacing:.02em;line-height:1.2}
.pitch span{display:block;font-size:7.6pt;color:#2b3a5c;margin-top:1.6mm;line-height:1.5}
.team{flex:.9;font-size:8.6pt;line-height:1.7;color:#1e3a8a;padding-bottom:1mm;white-space:nowrap}
.team i{font-style:normal;font-weight:800}
.team a{color:#2b3a5c;text-decoration:none;font-family:Menlo,"SF Mono",monospace;font-size:8pt}
.qr{text-align:center}.qr img{width:27mm;height:27mm;display:block;border-radius:1.2mm}
.qr span{display:block;font-size:6.8pt;font-weight:700;margin-top:1mm;white-space:nowrap}
</style></head><body>
<div class="page">
  <div class="hero"></div>
  <div class="foot">
    <div class="pitch"><em>现实版头号玩家</em><b>VR 只骗眼睛，这玩意儿骗腿。</b><span>穿上髋外骨骼原地迈步，屏幕上的坡和台阶变成腿上真实的力</span></div>
    <div class="team"><i>PRX</i> · 球球 / 艾玛<br><a>github.com/QiuQiuNB666/aima</a></div>
    <div class="qr"><img src="wx_qr.jpg"><span>扫码进群试玩</span></div>
  </div>
</div>
</body></html>
